<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Societelos — Council Projector</title>
</head>
<body class="host">
  <!-- Host projector screen, designed for a 1920x1080 classroom projector. -->
  <header id="host-topbar" class="topbar" aria-label="Session status"></header>

  <main id="host-main" class="host-main">
    <section id="view-lobby" class="view is-active" aria-label="Lobby"></section>
    <section id="view-intro" class="view" aria-label="Intro"></section>
    <section id="view-roles" class="view" aria-label="Role assignment"></section>
    <section id="view-chamber" class="view" aria-label="Council chamber"></section>
    <section id="view-end" class="view" aria-label="End of session"></section>
  </main>
</body>
</html>
