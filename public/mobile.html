<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Societelos — Council Node</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="mobile">
  <!-- Phone controller for one council node (NODE-01..NODE-05). -->
  <header id="m-header" class="m-header" aria-label="Node status">
    <span class="m-brand mono">SOCIETELOS</span>
    <span id="m-node-label" class="m-node-label mono">NOT CONNECTED</span>
  </header>

  <main id="m-main" class="m-main">
    <section id="m-view-join" class="m-view is-active" aria-label="Join">
      <p class="m-kicker mono">THE LOOM // SECURE CHANNEL</p>
      <h1 class="m-title">Council Access</h1>
      <p class="muted">Enter a name. Only the Loom will see it; the projector shows your node number.</p>
      <form id="join-form" class="m-form" autocomplete="off">
        <label for="join-name" class="m-label mono">Trustee name</label>
        <input id="join-name" class="m-input" name="name" type="text" maxlength="24" required placeholder="First name" enterkeyhint="go">
        <button id="join-submit" class="btn btn-primary m-btn" type="submit">CONNECT TO LOOM</button>
        <p id="join-error" class="m-error danger" role="alert" hidden></p>
      </form>
    </section>
    <section id="m-view-wait" class="m-view" aria-label="Waiting">
      <div class="m-center">
        <p class="m-kicker mono">CONNECTION ESTABLISHED</p>
        <div id="wait-node" class="node-badge mono">NODE-0?</div>
        <p id="wait-status" class="m-status">Waiting for the council to assemble…</p>
        <p class="muted">Keep this screen open. The projector will start the session.</p>
      </div>
    </section>
    <section id="m-view-role" class="m-view" aria-label="Secret role"></section>
    <section id="m-view-intel" class="m-view" aria-label="Intel"></section>
    <section id="m-view-debate" class="m-view" aria-label="Debate"></section>
    <section id="m-view-vote" class="m-view" aria-label="Vote"></section>
  </main>
</body>
</html>
