<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Societelos — Council Node</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="mobile">
  <!-- Phone controller for one council node (NODE-01..NODE-05). -->
  <header id="m-header" class="m-header" aria-label="Node status"></header>

  <main id="m-main" class="m-main">
    <section id="m-view-join" class="m-view is-active" aria-label="Join"></section>
    <section id="m-view-wait" class="m-view" aria-label="Waiting"></section>
    <section id="m-view-role" class="m-view" aria-label="Secret role"></section>
    <section id="m-view-intel" class="m-view" aria-label="Intel"></section>
    <section id="m-view-debate" class="m-view" aria-label="Debate"></section>
    <section id="m-view-vote" class="m-view" aria-label="Vote"></section>
  </main>
</body>
</html>
